---
duckduckgo_home:
  search_input:
    type: input
    by: css
    value: "#searchbox_input, #search_form_input_homepage, input[name='q']"
    wait_load: true
  search_button:
    type: button
    by: css
    value: "button[aria-label='Search'], button[type='submit'], #search_button_homepage, [role='button'][aria-label='Search']"
    wait_load: false
  cookie_button:
    type: button
    by: css
    value: "#feedback-link, .set-cookie-notice__button"
    wait_load: false
  results_container:
    type: webelement
    by: css
    value: "#links, .results--main, #links_wrapper"
    wait_load: false
