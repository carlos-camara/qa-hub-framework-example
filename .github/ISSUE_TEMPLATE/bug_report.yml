---
name: "Anomalía Determinada"
description: "¿Detectada una desviación en el comportamiento de alta fidelidad?"
title: "fix: <breve_descripción>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🛡️ Reporte de Anomalía
        > [!WARNING]
        > Asegúrate de que esto no sea una limitación arquitectónica conocida.
  - type: textarea
    id: context
    attributes:
      label: "Contexto Arquitectónico"
      description: "¿Cuál era la orquestación prevista? (ej. DuckDuckGo)"
      placeholder: "Intento: Verificación básica de búsqueda..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Surgical Reproduction"
      description: "Exact steps to trigger the anomaly."
      placeholder: |
        1. Run `run_tests.bat`
        2. Wait for GUI execution...
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: "Technical Drift"
      description: "Expected vs Actual outcomes."
      placeholder: |
        Expected: Element visible in 5s.
        Actual: Timeout after 10s.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Visual/Log Evidence"
      description: "Attach screenshots, console telemetry, or report fragments."
