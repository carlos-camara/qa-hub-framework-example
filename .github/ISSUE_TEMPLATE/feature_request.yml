---
name: "💡 Propuesta de Mejora"
description: "¿Tienes una visión para una nueva capa de inteligencia?"
title: "feat: <breve_descripción>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🧠 Engineering Enhancement
        > [!TIP]
        > Describe the vision for evolving the QA Hub ecosystem.
  - type: textarea
    id: problem
    attributes:
      label: "Problem/Opportunity Statement"
      description: "What friction are we trying to eliminate?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Architectural Solution"
      description: "A detailed technical design of the enhancement."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Considerations"
      description: "What other options were evaluated?"
