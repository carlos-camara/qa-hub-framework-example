name: CI - Quality Gates

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install Linting Tools
        run: |
          pip install flake8 black
      - name: Run Black Check
        run: black --check .
      - name: Run Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  smoke-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Run API Smoke Tests
        run: |
          python -m qa_framework.cli run --path features/duckduckgo/api --tags @smoke
          
      - name: Run GUI Smoke Tests (Headless)
        run: |
          # The framework should handle headless mode via environment variable or config
          export HEADLESS=true
          python -m qa_framework.cli run --path features/duckduckgo/gui --tags @smoke
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results/
