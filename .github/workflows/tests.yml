name: 🧪 Standard Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: carlos-camara/qa-hub-actions/setup-environment@main
        with:
          python-version: '3.10'
          
      - name: Run Smoke Tests
        uses: carlos-camara/qa-hub-actions/run-tests@main
        with:
          project-name: 'duckduckgo-example'
          test-command-api: 'python -m qa_framework.cli run --path features/duckduckgo/api --tags "@smoke"'
          test-command-gui: 'python -m qa_framework.cli run --path features/duckduckgo/gui --tags "@smoke"'
          headless: 'true'
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/test_run/
