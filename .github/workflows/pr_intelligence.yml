---
name: PR Intelligence

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.actor == 'carlos-camara' ||
      github.actor == 'dependabot[bot]'

    steps:
      - name:  Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧠 PR Intelligence Engine
        uses: carlos-camara/qa-hub-actions/pr-intelligence@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          critical-patterns: "features/environment.py,features/config/,.github/workflows/"

      - name: 📉 Test Debt & Churn Analysis
        uses: carlos-camara/qa-hub-actions/pr-churn-analyzer@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          logic-path: "features/steps/"
          test-path: ".feature"

      - name: 👤 Auto Assign PR
        if: github.actor != 'dependabot[bot]'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --add-assignee "$ASSIGNEE" --repo "$REPO"

      - name: ✨ Generate PR Summary
        if: github.actor != 'dependabot[bot]'
        uses: carlos-camara/qa-hub-actions/pr-summarizer@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target: "description"
