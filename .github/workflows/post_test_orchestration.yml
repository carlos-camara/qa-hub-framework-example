---
name: Post-Test Orchestration

on:
  workflow_run:
    workflows: ["Unified Test Suite"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Manual Run ID to process (optional)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  post-test:
    name: ☁️ Cloud Orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'push' ||
      github.event_name == 'workflow_dispatch')
    steps:
      - name: ☁️ Deploy Reports to S3
        uses: carlos-camara/qa-hub-actions/deploy-reports-s3@main
        with:
          project-name: "duckduckgo"
          s3-bucket: ${{ secrets.AWS_S3_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          upload-reports: 'true'
          upload-screenshots: 'true'
