---
name: Post-Test Orchestration

on:
  workflow_run:
    workflows: ["Unified Test Suite"]
    types:
      - completed

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  post-test:
    name: ☁️ Cloud Orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'push'
    steps:
      - name: ☁️ Deploy Reports to S3
        uses: carlos-camara/qa-hub-actions/deploy-reports-s3@main
        with:
          project-name: "duckduckgo"
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-east-1'
          s3-bucket: 'qa-hub-reports'
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-reports: 'true'
          upload-screenshots: 'true'
